<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ProStream</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-main {
            padding: 40px;
        }

        .upload-section {
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 40px;
        }

        .video-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .video-table th,
        .video-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--surface-light);
        }

        .video-table th {
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-video {
            background: #3498db;
        }

        .btn-delete {
            color: #ff4757;
            cursor: pointer;
            background: none;
            border: none;
        }

        .btn-edit {
            color: #eccc68;
            cursor: pointer;
            background: none;
            border: none;
            margin-right: 15px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <a href="/" class="logo"><i class="fa-solid fa-play"></i> <span>ProStream</span></a>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="/admin.html" class="nav-link active"><i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span></a>
                </li>
                <li class="nav-item">
                    <a href="/" class="nav-link"><i class="fa-solid fa-house"></i> <span>View Site</span></a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span></a>
                </li>
            </ul>
        </aside>

        <main class="main-content admin-main">
            <header>
                <h1>Admin Dashboard</h1>
                <div class="user-profile">
                    <span id="adminName">Admin User</span>
                </div>
            </header>

            <div class="admin-stats" id="statsContainer">
                <div class="stat-card">
                    <div class="stat-value" id="totalUsers">-</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalVideos">-</div>
                    <div class="stat-label">Total Videos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalViews">-</div>
                    <div class="stat-label">Total views</div>
                </div>
            </div>

            <div class="upload-section">
                <h3><i class="fa-solid fa-cloud-arrow-up"></i> Upload New video</h3>
                <form id="uploadForm"
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                    <div class="form-group">
                        <label>Video Title</label>
                        <input type="text" id="vTitle" required placeholder="Enter video title">
                    </div>
                    <div class="form-group">
                        <label>Duration (e.g. 10:45)</label>
                        <input type="text" id="vDuration" placeholder="0:00">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Description</label>
                        <textarea id="vDesc"
                            style="width: 100%; height: 100px; padding: 10px; background: var(--surface-light); border: none; border-radius: 4px; color: white;"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Video File (.mp4)</label>
                        <input type="file" id="vFile" accept="video/mp4" required>
                    </div>
                    <div class="form-group">
                        <label>Thumbnail Image</label>
                        <input type="file" id="vThumb" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn-auth"
                        style="grid-column: span 2; width: auto; justify-self: start; padding: 12px 40px;">Publish
                        video</button>
                    <div id="uploadStatus" style="grid-column: span 2; display: none;">Uploading... <span
                            id="progress">0%</span></div>
                </form>
            </div>

            <div class="video-section">
                <h3>Manage Videos</h3>
                <table class="video-table">
                    <thead>
                        <tr>
                            <th>Video</th>
                            <th>Upload Date</th>
                            <th>Views</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="videoTableBody">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || user.role !== 'admin') {
            window.location.href = '/admin-login.html';
        }

        document.getElementById('adminName').innerText = user.username || user.name;

        async function fetchStats() {
            try {
                const res = await fetch('/api/videos/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                document.getElementById('totalUsers').innerText = data.totalUsers;
                document.getElementById('totalVideos').innerText = data.totalVideos;
                document.getElementById('totalViews').innerText = data.totalViews;
            } catch (err) { console.error(err); }
        }

        async function fetchVideos() {
            try {
                const res = await fetch('/api/videos');
                const videos = await res.json();
                const tbody = document.getElementById('videoTableBody');
                tbody.innerHTML = videos.map(v => `
                    <tr>
                        <td style="display: flex; align-items: center; gap: 15px;">
                            <img src="${v.thumbnail}" width="100" style="border-radius:4px">
                            <div>
                                <div style="font-weight:600">${v.title}</div>
                                <div style="font-size:12px; color:var(--text-muted)">${v.duration}</div>
                            </div>
                        </td>
                        <td>${new Date(v.uploadDate).toLocaleDateString()}</td>
                        <td>${v.views}</td>
                        <td>
                            <button class="btn-edit" onclick="editVideo('${v._id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-delete" onclick="deleteVideo('${v._id}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function deleteVideo(id) {
            if (!confirm('Are you sure you want to delete this video?')) return;
            try {
                const res = await fetch(`/api/videos/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    fetchVideos();
                    fetchStats();
                }
            } catch (err) { alert('Delete failed'); }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('vTitle').value);
            formData.append('duration', document.getElementById('vDuration').value);
            formData.append('description', document.getElementById('vDesc').value);
            formData.append('video', document.getElementById('vFile').files[0]);
            formData.append('thumbnail', document.getElementById('vThumb').files[0]);

            const status = document.getElementById('uploadStatus');
            status.style.display = 'block';

            try {
                const res = await fetch('/api/videos/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                if (res.ok) {
                    alert('Video uploaded successfully');
                    status.style.display = 'none';
                    document.getElementById('uploadForm').reset();
                    fetchVideos();
                    fetchStats();
                } else {
                    const data = await res.json();
                    alert(data.error);
                }
            } catch (err) {
                alert('Upload failed');
            }
        });

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        fetchStats();
        fetchVideos();
    </script>
</body>

</html>
