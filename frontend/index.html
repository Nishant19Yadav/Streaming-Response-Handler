<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStream | Unlimited Video Streaming</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        // Initialize Firebase
        firebase.initializeApp(window.firebaseConfig);
        firebase.analytics();
    </script>
</head>


<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="/" class="logo">
                <i class="fa-solid fa-play"></i> <span>ProStream</span>
            </a>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="#" class="nav-link active" onclick="loadCategory('all')">
                        <i class="fa-solid fa-house"></i> <span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="loadCategory('trending')">
                        <i class="fa-solid fa-fire"></i> <span>Trending</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="showHistory()">
                        <i class="fa-solid fa-clock-rotate-left"></i> <span>History</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="showLiked()">
                        <i class="fa-solid fa-thumbs-up"></i> <span>Liked Videos</span>
                    </a>
                </li>
            </ul>
            <div class="divider"></div>
            <ul class="nav-links" id="admin-link-container" style="display: none;">
                <li class="nav-item">
                    <a href="/admin.html" class="nav-link">
                        <i class="fa-solid fa-user-shield"></i> <span>Admin Panel</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search for movies, shows, or creators...">
                </div>
                <div class="user-profile" id="userProfileArea">
                    <a href="auth.html" class="btn-login">Login / Sign Up</a>
                </div>
            </header>

            <!-- Hero Section -->
            <section class="hero" id="heroBanner">
                <div class="hero-content">
                    <h1>Trending Video</h1>
                    <p>Experience high-quality streaming without limits. Join millions of viewers and explore the most
                        popular content today.</p>
                    <button class="btn-auth" id="playHeroBtn" style="padding: 12px 30px; width: auto;">
                        <i class="fa-solid fa-play"></i> Watch Now
                    </button>
                </div>
            </section>

            <!-- Video Sections -->
            <section class="video-section">
                <div class="section-title">
                    <span id="sectionLabel">All Videos</span>
                </div>
                <div class="video-grid" id="videoGrid">
                    <!-- Dynamic Loading -->
                </div>
            </section>

            <!-- Continue Watching (Logged in only) -->
            <section class="video-section" id="continueSection" style="display: none;">
                <div class="section-title">Recently Watched</div>
                <div class="video-grid" id="historyGrid"></div>
            </section>
        </main>
    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="videoModal">
        <span class="close-modal" id="closeModal">&times;</span>
        <div class="player-container">
            <video id="mainPlayer" controls autoplay controlsList="nodownload"></video>
            <div id="videoInfoOverlay" style="padding: 20px; color: white;">
                <h2 id="modalVideoTitle">Video Title</h2>
                <div style="display: flex; gap: 20px; align-items: center; margin-top: 10px;">
                    <span id="modalVideoViews"><i class="fa-solid fa-eye"></i> 0 views</span>
                    <button id="likeBtn"
                        style="background: none; border: none; color: white; cursor: pointer; font-size: 16px;">
                        <i class="fa-regular fa-thumbs-up"></i> Like
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
