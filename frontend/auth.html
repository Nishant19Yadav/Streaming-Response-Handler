<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sign Up - ProStream</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        firebase.initializeApp(window.firebaseConfig);
    </script>
</head>


<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a href="/" class="logo" style="margin-bottom: 30px; display: inline-block;">
                <i class="fa-solid fa-play"></i> <span>ProStream</span>
            </a>

            <div id="loginFormContainer">
                <h2>Sign In</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-container">
                            <input type="password" id="loginPassword" required placeholder="Enter password">
                            <i class="fa-solid fa-eye-slash password-toggle"
                                onclick="togglePasswordVisibility('loginPassword', this)"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn-auth">Sign In</button>
                </form>
                <div class="divider">OR</div>
                <button class="btn-google" id="googleLoginBtn">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="20" alt="Google">
                    Continue with Google
                </button>
                <p class="auth-switch">New to ProStream? <a href="#" onclick="toggleAuth()">Sign up now</a></p>
                <p class="auth-switch" style="margin-top: 10px;"><a href="/admin-login.html"
                        style="font-size: 12px; color: var(--text-muted);">Admin Login</a></p>
            </div>

            <div id="signupFormContainer" style="display: none;">
                <h2>Sign Up</h2>
                <form id="signupForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signupName" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signupEmail" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-container">
                            <input type="password" id="signupPassword" required placeholder="Create password">
                            <i class="fa-solid fa-eye-slash password-toggle"
                                onclick="togglePasswordVisibility('signupPassword', this)"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn-auth">Sign Up</button>
                </form>
                <p class="auth-switch">Already have an account? <a href="#" onclick="toggleAuth()">Sign in</a></p>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }

        function toggleAuth() {
            const login = document.getElementById('loginFormContainer');
            const signup = document.getElementById('signupFormContainer');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                signup.style.display = 'none';
            } else {
                login.style.display = 'none';
                signup.style.display = 'block';
            }
        }

        // Handle forms
        const authBase = '/api/auth';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${authBase}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert('Login failed');
            }
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            try {
                const res = await fetch(`${authBase}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert('Signup failed');
            }
        });

        document.getElementById('googleLoginBtn').onclick = async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await firebase.auth().signInWithPopup(provider);
                const user = result.user;

                // Sync with our backend
                const res = await fetch(`${authBase}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: user.displayName,
                        email: user.email,
                        googleId: user.uid,
                        loginType: 'google'
                    })
                });

                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    console.log('Login successful, redirecting...');
                    window.location.href = 'index.html'; // Use explicit filename
                } else {
                    alert('Login failed: ' + (data.error || 'Server did not return a token'));
                }
            } catch (error) {
                console.error('Google login failed', error);
                alert('Connection failed: ' + error.message);
            }

        };

    </script>
</body>

</html>
